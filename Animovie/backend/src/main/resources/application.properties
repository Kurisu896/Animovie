spring.application.name=bgm-backend
server.port=8080

# MySql
spring.datasource.url=jdbc:mysql://localhost:3306/bgm?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mybatis-plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:/mappers/**/*.xml

spring.sql.init.mode=embedded
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd  HH:mm:ss
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# AI??
ai.dashscope.api.key=${DASHSCOPE_API_KEY:}
ai.dashscope.model=qwen-plus
ai.dashscope.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
